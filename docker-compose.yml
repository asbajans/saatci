services:
  db:
    image: postgres:15-alpine
    container_name: saatci-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:4112:5432"
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-saatci}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
      POSTGRES_DB: "${POSTGRES_DB:-saatci}"
    volumes:
      - saatci_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-saatci} -d ${POSTGRES_DB:-saatci}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - saatci_network

  redis:
    image: redis:7-alpine
    container_name: saatci-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:4113:6379"
    networks:
      - saatci_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: saatci-backend
    restart: unless-stopped
    ports:
      - "4111:3001"
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-saatci}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:-saatci}?schema=public"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set}"
      INTEGRATION_SECRET: "${INTEGRATION_SECRET:-}"
      JWT_EXPIRE: "${JWT_EXPIRE:-7d}"
      NODE_ENV: "production"
      PORT: "3001"
      CORS_ORIGIN: "${CORS_ORIGIN:-https://saatci.asb.web.tr}"
      PUBLIC_APP_URL: "${PUBLIC_APP_URL:-https://saatci.asb.web.tr}"
      META_APP_ID: "${META_APP_ID:-}"
      META_APP_SECRET: "${META_APP_SECRET:-}"
      META_VERIFY_TOKEN: "${META_VERIFY_TOKEN:-saatci_verify_token_change_me}"
      META_PAGE_ACCESS_TOKEN: "${META_PAGE_ACCESS_TOKEN:-}"
      WHATSAPP_PHONE_NUMBER_ID: "${WHATSAPP_PHONE_NUMBER_ID:-}"
      WHATSAPP_WABA_ID: "${WHATSAPP_WABA_ID:-}"
      WHATSAPP_ACCESS_TOKEN: "${WHATSAPP_ACCESS_TOKEN:-}"
      TWILIO_ACCOUNT_SID: "${TWILIO_ACCOUNT_SID:-}"
      TWILIO_AUTH_TOKEN: "${TWILIO_AUTH_TOKEN:-}"
      TWILIO_PHONE_NUMBER: "${TWILIO_PHONE_NUMBER:-}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
      INITIAL_ADMIN_NAME: "${INITIAL_ADMIN_NAME:-}"
      INITIAL_ADMIN_EMAIL: "${INITIAL_ADMIN_EMAIL:-}"
      INITIAL_ADMIN_PASSWORD: "${INITIAL_ADMIN_PASSWORD:-}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - saatci_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: saatci-frontend
    restart: unless-stopped
    ports:
      - "4110:80"
    depends_on:
      - backend
    networks:
      - saatci_network

  adminer:
    image: adminer
    container_name: saatci-adminer
    restart: unless-stopped
    ports:
      - "127.0.0.1:4114:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    networks:
      - saatci_network

networks:
  saatci_network:
    driver: bridge

volumes:
  saatci_db_data:
