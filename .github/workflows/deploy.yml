name: Saatci CRM CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Build frontend
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: saatci
          POSTGRES_PASSWORD: saatci_test_password
          POSTGRES_DB: saatci
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U saatci -d saatci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://saatci:saatci_test_password@localhost:5432/saatci?schema=public

      - name: TypeScript type check
        run: npx tsc --noEmit
        env:
          DATABASE_URL: postgresql://saatci:saatci_test_password@localhost:5432/saatci?schema=public
          JWT_SECRET: test-secret

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [frontend-ci, backend-ci]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: saatci-frontend:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: saatci-backend:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test frontend container
        run: |
          cat > /tmp/nginx-test.conf << 'EOF'
          server {
              listen 80;
              server_name _;

              location / {
                  root /usr/share/nginx/html;
                  try_files $uri $uri/ /index.html;
              }
          }
          EOF

          docker run -d --name frontend-test \
            -p 3000:80 \
            -v /tmp/nginx-test.conf:/etc/nginx/conf.d/default.conf:ro \
            saatci-frontend:test

          sleep 3
          docker ps -a --filter name=frontend-test
          docker logs frontend-test
          curl -f http://localhost:3000/ || (docker logs frontend-test && docker stop frontend-test && docker rm frontend-test && exit 1)
          docker stop frontend-test
          docker rm frontend-test

      - name: Test backend container
        run: |
          docker network create test-network || true
          docker run --rm -d --name db-test --network test-network \
            -e POSTGRES_USER=saatci \
            -e POSTGRES_PASSWORD=saatci_test_password \
            -e POSTGRES_DB=saatci \
            postgres:15-alpine
          for i in {1..30}; do
            if docker exec db-test pg_isready -U saatci -d saatci; then
              break
            fi
            sleep 2
          done
          docker run --rm -d --name backend-test --network test-network -p 3001:3001 \
            -e DATABASE_URL=postgresql://saatci:saatci_test_password@db-test:5432/saatci?schema=public \
            -e JWT_SECRET=test-secret \
            -e INTEGRATION_SECRET=test-integration-secret \
            -e NODE_ENV=production \
            saatci-backend:test
          sleep 20
          curl -f http://localhost:3001/health || (docker logs backend-test && exit 1)
          docker stop backend-test db-test
          docker network rm test-network || true

  deploy:
    name: Deploy via Portainer Webhook
    runs-on: ubuntu-latest
    needs: [frontend-ci, backend-ci, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && env.PORTAINER_WEBHOOK_URL != ''
    env:
      PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trigger Portainer webhook redeploy
        run: |
          if [ -z "$PORTAINER_WEBHOOK_URL" ]; then
            echo "PORTAINER_WEBHOOK_URL secret is not set; skipping deployment."
            exit 0
          fi
          HTTP_CODE=$(curl -s -w "\n%{http_code}" -X POST "$PORTAINER_WEBHOOK_URL" -o /tmp/portainer-webhook-response.txt)
          cat /tmp/portainer-webhook-response.txt
          echo "HTTP Code: $HTTP_CODE"
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Portainer webhook redeploy triggered successfully"
          else
            echo "Portainer webhook redeploy failed"
            exit 1
          fi

      - name: Wait for deployment
        run: |
          sleep 60
          for i in {1..10}; do
            HEALTH=$(curl -s -o /dev/null -w "%{http_code}" https://saatci.asb.web.tr/api/health || echo "000")
            if [ "$HEALTH" = "200" ]; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i: Health check returned $HEALTH, waiting..."
            sleep 30
          done
          echo "Health check failed after 10 attempts"
          exit 1

      - name: Notify success
        if: success()
        run: |
          echo "Deployment successful"
          echo "Commit: ${{ github.sha }}"
          echo "URL: https://saatci.asb.web.tr"

      - name: Notify failure
        if: failure()
        run: |
          echo "Deployment failed"
          echo "Commit: ${{ github.sha }}"
